<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Weather Prediction App</title>

<style>

body {

  margin: 0;

  font-family: Arial, sans-serif;

  background: linear-gradient(135deg, #5b86e5, #36d1dc);

  min-height: 100vh;

  display: flex;

  justify-content: center;

  align-items: center;

  padding: 20px;

  box-sizing: border-box;

}

.card {

  background: white;

  width: 100%;

  max-width: 420px;

  padding: 25px;

  border-radius: 20px;

  text-align: center;

  box-shadow: 0 8px 25px #0002;

}

h1 { color: #2864b7; }

input, button {

  padding: 12px;

  border-radius: 8px;

  font-size: 16px;

  margin: 5px 0;

}

input {

  width: 90%;

  border: 1px solid #aaa;

}

button {

  width: 100%;

  border: none;

  background: #2864b7;

  color: white;

  cursor: pointer;

}

button:hover { background: #174681; }

#result { margin-top: 20px; }

.temp { font-size: 42px; font-weight: bold; }

.small { color: #555; }

</style>

</head>

<body>

<div class="card">

  <h1>🌤 Weather App</h1>

  <p>Check the weather of any city</p>

  <input id="city" type="text"

         placeholder="Enter city name">

  <button onclick="getWeather()">Check Weather</button>

  <div id="result">

    <p class="small">Enter a city to see its weather.</p>

  </div>

</div>

<script>

async function getWeather() {

  const city = document.getElementById("city").value.trim();

  const result = document.getElementById("result");

  if (!city) {

    result.innerHTML = "Please enter a city name.";

    return;

  }

  result.innerHTML = "Loading weather...";

  try {

    const geoURL =

      "https://geocoding-api.open-meteo.com/v1/search?name=" +

      encodeURIComponent(city) + "&count=1&language=en&format=json";

    const geoResponse = await fetch(geoURL);

    const geoData = await geoResponse.json();

    if (!geoData.results || geoData.results.length === 0) {

      throw new Error("City not found. Try another city.");

    }

    const place = geoData.results[0];

    const weatherURL =

      "https://api.open-meteo.com/v1/forecast?latitude=" +

      place.latitude + "&longitude=" + place.longitude +

      "&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code" +

      "&daily=temperature_2m_max,temperature_2m_min" +

      "&forecast_days=3&timezone=auto";

    const response = await fetch(weatherURL);

    const data = await response.json();

    const current = data.current;

    const daily = data.daily;

    const descriptions = {

      0: "Clear Sky",

      1: "Mainly Clear",

      2: "Partly Cloudy",

      3: "Overcast",

      45: "Foggy",

      48: "Foggy",

      51: "Light Drizzle",

      53: "Drizzle",

      55: "Heavy Drizzle",

      61: "Light Rain",

      63: "Rain",

      65: "Heavy Rain",

      71: "Light Snow",

      73: "Snow",

      75: "Heavy Snow",

      80: "Rain Showers",

      81: "Rain Showers",

      82: "Heavy Rain Showers",

      95: "Thunderstorm",

      96: "Thunderstorm",

      99: "Thunderstorm"

    };

    let forecast = "";

    for (let i = 0; i < daily.time.length; i++) {

      forecast += `

        <p><b>${daily.time[i]}</b><br>

        High: ${daily.temperature_2m_max[i]}°C |

        Low: ${daily.temperature_2m_min[i]}°C</p>`;

    }

    result.innerHTML = `

      <h2>${place.name}, ${place.country}</h2>

      <div class="temp">${current.temperature_2m}°C</div>

      <h3>${descriptions[current.weather_code] || "Weather Update"}</h3>

      <p>💧 Humidity: ${current.relative_humidity_2m}%</p>

      <p>💨 Wind Speed: ${current.wind_speed_10m} km/h</p>

      <hr>

      <h3>3-Day Weather Forecast</h3>

      ${forecast}

      <p class="small">Data: Open-Meteo</p>`;

  } catch (error) {

    result.innerHTML = "Error: " + error.message;

  }

}

</script>

</body>

</html>
